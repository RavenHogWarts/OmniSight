name: Build

# PR 触发的双平台打包（偏离 156：用户决定加回 PR 流水线）。
#
# 背景：只有一台 Windows 真机、macOS 只有一台虚拟机用于实际运行验证——包由 runner
# 构建，本地只做真机 / 虚拟机上的运行验证。产物走 artifact 下载，不建 Release、
# 不碰 tag：发布仍然是 release.yml（tag 触发）那一条路，两条流水线不重叠。
#
# 它**只构建、不跑测试**：测试仍在本地跑（10 文档 §11.1 的决定对这条同样适用），
# 平台无关测试的唯一 CI 出口是 release.yml 的 macos job。前端在 runner 上现场
# 重新构建（与 release.yml 同一条理由：产物里的界面一定是当前源码编出来的）。
on:
  pull_request:
  workflow_dispatch:
    # 手动运行时可以只勾要构建的目标（PR 时三者全建，勾选只对手动运行生效）。
    inputs:
      windows:
        description: 构建 Windows 便携包
        type: boolean
        default: true
      macos_arm64:
        description: 构建 macOS arm64（Apple Silicon）
        type: boolean
        default: true
      macos_x64:
        description: 构建 macOS x64（Intel / 虚拟机）
        type: boolean
        default: true

# 只读：这条流水线不上传 Release、不需要写权限。
permissions:
  contents: read

jobs:
  windows:
    # PR 全建；手动运行时按勾选取舍（pull_request 事件没有 inputs 上下文）。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-latest
    env:
      # 与 release.yml 同一条理由：runner 的管道 stdout 按 locale 挑编码，
      # 中文输出会抛 UnicodeEncodeError。
      PYTHONIOENCODING: utf-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt -r requirements-optional.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --no-installer：PR 验证不需要 Inno Setup 的安装包（省一步 choco 安装），
      # 便携 zip 已是完整的可分发形态。
      - run: python tools/build.py --release --no-installer

      - uses: actions/upload-artifact@v4
        with:
          name: OmniSight-windows
          # PR 产物 24 小时过期：它是给"这轮改动马上要人工验证"用的，不是存档。
          retention-days: 1
          path: |
            dist/OmniSight-portable.zip
            dist/OmniSight-portable.zip.sha256

  # **双架构矩阵**：arm64（macos-latest 已是 Apple Silicon 镜像）+ x86_64
  # （macos-15-intel；Windows 宿主上的 macOS 虚拟机只能是 x86_64）。universal2
  # 是更好的长期形态，但被 binary 依赖的 wheel 选择问题挡着（pip 在 arm64 上
  # 优先装 arm64-only wheel，--target-arch=universal2 会在 lipo 阶段失败），
  # 记账在 PROGRESS M9。
  macos:
    # PR 全建；手动运行时按勾选跳过对应架构（被跳过的矩阵项显示为 Skipped）。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs[matrix.want] }}
    strategy:
      # 一个架构失败不该连坐另一个（它们验证的是同一份代码的不同编译目标）。
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            want: macos_arm64
          - arch: x64
            runner: macos-15-intel
            want: macos_x64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev 已含 requirements：三条 pyobjc 带 darwin 环境标记，
      # 在 mac 上直接安装；optional 里的 pynput 是兜底键盘后端。
      - run: pip install -r requirements-dev.txt -r requirements-optional.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --release 出 tar.gz（名字带架构后缀）。**不要改成直接上传 .app 目录**：
      # upload-artifact 的 LCA 规则会剥掉 OmniSight.app 这层包装（解压出来是裸的
      # Contents/），且不走 gzip——同一个包大出几十 MB。artifact 下载自带一层
      # GitHub 的 zip 包装（平台行为，去不掉），里面就是 tar.gz 与它的 .sha256。
      # CI 不配置签名身份（自签名私钥不进 CI，19 文档 §4.4）——ad-hoc 签名，TCC
      # 授权不跨构建存活，属预期：测试机每次重新授权，或按 docs/macos-build.md
      # 固定一个本地身份。
      - run: python tools/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: OmniSight-macos-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/OmniSight-macos-*.tar.gz
            dist/OmniSight-macos-*.tar.gz.sha256
