name: Build

# PR 触发的双平台打包（偏离 156：用户决定加回 PR 流水线）。
#
# 背景：只有一台 Windows 真机、macOS 只有一台虚拟机用于实际运行验证——包由 runner
# 构建，本地只做真机 / 虚拟机上的运行验证。产物走 artifact 下载，不建 Release、
# 不碰 tag：发布仍然是 release.yml（tag 触发）那一条路，两条流水线不重叠。
#
# 它**只构建、不跑测试**：测试仍在本地跑（10 文档 §11.1 的决定对这条同样适用），
# 平台无关测试的唯一 CI 出口是 release.yml 的 macos job。前端在 runner 上现场
# 重新构建（与 release.yml 同一条理由：产物里的界面一定是当前源码编出来的）。
on:
  pull_request:
  workflow_dispatch:
    # 手动运行时可以只勾要构建的目标（PR 时三者全建，勾选只对手动运行生效）。
    inputs:
      windows:
        description: 构建 Windows 便携包
        type: boolean
        default: true
      macos_arm64:
        description: 构建 macOS arm64（Apple Silicon）
        type: boolean
        default: true
      macos_x64:
        description: 构建 macOS x64（Intel / 虚拟机）
        type: boolean
        default: true

# 只读：这条流水线不上传 Release、不需要写权限。
permissions:
  contents: read

jobs:
  windows:
    # PR 全建；手动运行时按勾选取舍（pull_request 事件没有 inputs 上下文）。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-latest
    env:
      # 与 release.yml 同一条理由：runner 的管道 stdout 按 locale 挑编码，
      # 中文输出会抛 UnicodeEncodeError。
      PYTHONIOENCODING: utf-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt -r requirements-optional.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --no-installer：PR 验证不需要 Inno Setup 的安装包（省一步 choco 安装），
      # 便携 zip 已是完整的可分发形态。
      - run: python tools/build.py --release --no-installer

      - uses: actions/upload-artifact@v4
        with:
          name: OmniSight-windows
          # PR 产物 24 小时过期：它是给"这轮改动马上要人工验证"用的，不是存档。
          retention-days: 1
          path: |
            dist/OmniSight-portable.zip
            dist/OmniSight-portable.zip.sha256

  # **双架构**：arm64（macos-latest 已是 Apple Silicon 镜像）+ x86_64
  # （macos-15-intel；Windows 宿主上的 macOS 虚拟机只能是 x86_64）。universal2
  # 是更好的长期形态，但被 binary 依赖的 wheel 选择问题挡着（pip 在 arm64 上
  # 优先装 arm64-only wheel，--target-arch=universal2 会在 lipo 阶段失败），
  # 记账在 PROGRESS M9。
  #
  # **不用矩阵、拆成两个薄 job 复用同一个本地 composite action**：job 级 `if`
  # 不能引用 matrix 上下文（GitHub 语义限制，step 级才可以），矩阵做不了
  # "按架构勾选"；两个 job 各自直接引 inputs，被跳过的显示为 Skipped。
  macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_arm64 }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # 本地 action 的解析发生在它自己的步骤运行之前——必须先 checkout，否则
      # 工作区为空，runner 找不到 .github/actions/build-macos/action.yml。
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-macos
        with:
          arch: arm64

  macos-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_x64 }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      # 同上：先 checkout 再用本地 action。
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-macos
        with:
          arch: x64
