name: Release

# **只由版本 tag 触发**：v0.1.0-alpha.1 / v0.1.0-beta.1 / v0.1.0。push 与
# pull_request 上没有 job（构建流水线在 build.yml，见 10 文档 §11.1 与偏离 156）。
#
# 结构是"预检 → 双平台并行构建 → 汇总发版"四段：
#
#   preflight  核对 tag 与版本、许可快照——全程不到一分钟，红在这里不浪费构建；
#   windows    便携 zip + 安装包（Inno Setup）；
#   macos      arm64 / x64 双架构矩阵：平台无关测试 + tar.gz（每个架构一件）；
#   publish    下载全部构建产物，生成说明，建 Release——**唯一需要写权限的 job**。
#
# 除 macos job 里那一条平台无关 pytest（"核心层不依赖 Win32"的唯一持续证据，
# 10 文档 §11.1），流水线不跑任何测试与静态检查——它们在本地跑（§11.1 的决定）。
on:
  push:
    tags:
      - "v*"

# 收紧到只读；写权限单独给 publish（它要建 Release）。
permissions:
  contents: read

jobs:
  # ── 预检：tag 与版本、许可快照（构建前红掉，不浪费十几分钟）─────────────
  preflight:
    runs-on: windows-latest
    env:
      # runner 把子进程的 stdout 接成管道，于是 Python 不走控制台的 Unicode 接口，
      # 而是按 locale 挑编码——实测 cp1252。那样任何一行中文输出都会抛
      # UnicodeEncodeError 把这条流水线弄红（第一次发版就死在脚本报喜的那一行上）。
      # 工具自己也各有一道（tools/_console.py），两道互不依赖。
      PYTHONIOENCODING: utf-8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      # 放在最前面：tag 与代码里的 __version__ 对不上时，等构建完再发现等于白跑十几
      # 分钟；而"发布页写 0.2.0、EXE 属性页写 0.1.0-alpha.1"这种产物一旦发出去，
      # 用户唯一合理的解释是"文件被人换过"。
      - name: 核对 tag 与版本号
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py --tag "$env:TAG" --check-only

      # **这条流水线不跑测试与静态检查**（ruff / pytest / check_frontend / check_types /
      # check_bundle --check 都在本地跑，见 10 文档 §11.1 那张表）。留下的这一道不是
      # 测试而是**分发义务**：许可清单是提交进版本库的快照（`tools/licenses.py` 读它，
      # 不读 node_modules），快照过期意味着发出去的 THIRD_PARTY_NOTICES.md 少列或错列
      # 依赖。它只比对两个文件，不到一秒。
      - run: python tools/npm_licenses.py --check

  # ── Windows 构建：便携 zip + 安装包 ────────────────────────────────────
  windows:
    needs: preflight
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    # 构建 + 打包。挂住时宁可红掉，也别静静烧掉 6 小时额度。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt -r requirements-optional.txt

      # Node 是构建前端产物用的（15 文档 §3.1）。**装了它，tools/build.py 就会重新
      # 构建而不是用版本库里那份提交的产物**——发布物里的前端因此一定是当前源码编
      # 出来的。没装也能打包（那条回退是给 pip 路径留的），但发布不该走回退。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 安装包要 Inno Setup 的 ISCC.exe。runner 镜像不保证带它，所以自己装一次；
      # 找不到编译器时 --release 直接失败（那是有意的，见 10 文档 §10.1）。
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      # --release 才组装发布物（默认只出 EXE，见 tools/build.py 的说明）：便携 zip
      # 与安装包各一件。裸 EXE 不发布——它带不走 LICENSE、许可清单与 README.txt，
      # 而那几份是分发义务。
      - run: python tools/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          # 发版产物要经 publish job 转挂到 Release；保留一周以防 publish 红掉后重跑。
          retention-days: 7
          path: |
            dist/OmniSight-portable.zip
            dist/OmniSight-portable.zip.sha256
            dist/OmniSight-Setup.exe
            dist/OmniSight-Setup.exe.sha256

  # ── macOS 构建：arm64 / x64 双架构矩阵 ────────────────────────────────
  macos:
    needs: preflight
    strategy:
      # 一个架构失败不该连坐另一个（它们验证的是同一份代码的不同编译目标）。
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev 已含 requirements（三条 pyobjc 带 darwin 环境标记，直接
      # 可用）；optional 里的 pynput 是 mac 的兜底键盘后端。
      - run: pip install -r requirements-dev.txt -r requirements-optional.txt

      # 10 文档 §11.1 兑现的那一条：非 Windows 上跑测试是「核心层真的不依赖
      # Win32」这一架构主张的唯一持续证据——A1/A3/A4 那类"在 Windows 上跑测试
      # 永远发现不了"的缺口，正是靠这条线拦住的。两个架构各跑一遍，顺带把两套
      # pyobjc 二进制都验到。
      - run: python -m pytest tests/ -m "not windows_only" -q

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tar.gz 名字带架构后缀（OmniSight-macos-arm64 / -x64，见 build.py）。
      # CI 不配置签名身份（自签名私钥不进 CI，19 文档 §4.4）——本 job 产物为
      # ad-hoc 签名；要固定身份，发版后按 docs/macos-build.md 在本机重签重传，
      # 或将来把签名身份做成 secrets 再议。
      - run: python tools/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/OmniSight-macos-*.tar.gz
            dist/OmniSight-macos-*.tar.gz.sha256

  # ── 汇总发版：下载全部产物，生成说明，建 Release ───────────────────────
  publish:
    needs: [windows, macos]
    runs-on: windows-latest
    permissions:
      # 整条流水线里唯一需要写权限的 job：它建 Release。
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 变更日志要 git log 一路走到上一个 tag。默认的浅克隆下它是**空的，而且
          # 不报错**——tools/release_notes.py 因此显式挡了浅克隆，这里则给足深度。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      # 四个构建 job 的产物全部落回 dist/（merge-multiple：同名不冲突，摊平）。
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # 变更日志取自 git 提交记录；校验值取自构建 job 写下的 .sha256 并逐件比对。
      # assets / prerelease / title 由脚本给出（产物名字只有 tools/build.py 一处
      # 真源，改名不会让这里静默少挂一件）。--platforms 显式列出本次构建的平台：
      # 名单默认按"本机"回答，而汇总机不是任何一台构建机。
      - name: 生成发版说明
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py --tag "$env:TAG" --platforms windows,macos-arm64,macos-x64 --out release-notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          ASSETS: ${{ steps.notes.outputs.assets }}
        # tag 名与标题一律经 env 传进来，不做 ${{ }} 内联展开：内联会把它们直接拼进
        # 脚本文本，而 tag 名是外部输入。
        run: |
          $assets = $env:ASSETS.Split(' ')
          $meta = @('--title', $env:TITLE, '--notes-file', 'release-notes.md')
          $meta += "--prerelease=$($env:PRERELEASE)"   # 出参就是 true / false
          gh release view $env:TAG --json id 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # 重跑（上一次卡在上传或超时）时不该停在"Release 已存在"上：改说明、覆盖资产。
            gh release edit $env:TAG $meta
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release upload $env:TAG $assets --clobber
          } else {
            # --verify-tag：tag 必须已经在远端存在，否则 gh 会顺手从默认分支建一个。
            gh release create $env:TAG --verify-tag $meta $assets
          }
