[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisight"
# 打包元数据用 PEP 440 的**规范形式**；面向用户的版本串是 src/omnisight/__init__.py
# 的 __version__（"0.1.0-alpha.1"）。两者按 PEP 440 规范化后是同一个版本，
# tests/unit/test_version.py 断言这一点，因此这两处字面量不会漂移。
version = "0.1.0a1"
description = "本地运行的应用使用时长与键盘统计工具（TimeLens + KeyTrace 合并）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RavenHogwarts" }]

[project.scripts]
omnisight = "omnisight.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# **必须是递归通配**：setuptools 的 `*` 不跨目录分隔符，而前端有五层子目录
# （css/components、css/views、js/core、js/domain、js/charts、js/components、
# js/views、js/types）。写成 `static/js/*.js` 时 wheel 里只有 main.js 与 theme.js，
# 装出来的仪表盘是一片空白——app.css 的 @import 与 main.js 的 import 全部 404，
# 而首页本身仍然 200，所以这种坏法完全静默。
#
# 一直没暴露是因为实际分发走 PyInstaller（OmniSight.spec 拷整个 static 目录），
# `pip install` 只在开发时用。tests/unit/test_package_data.py 现在盯着这一条。
#
# 递归 `**` 需要 setuptools >= 62.3，build-system 里要求的是 >= 68。
omnisight = [
    "presentation/templates/**/*.html",
    "presentation/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests 也进搜索路径：共享测试替身放在 tests/fakes.py，做成 fixture 反而绕。
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = [
    "windows_only: 需要真实 Windows API，其他平台跳过（数量应保持极少，见 11 文档 §1）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
